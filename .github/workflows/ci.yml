name: CI

on:
  push:
    # `ci-fix-**` runs the matrix on in-flight fix branches so we can
    # validate a green CI before merging to main. Remove this pattern
    # once the backlog of `ci-fix-*` branches is cleaned up.
    branches: [main, "ci-fix-**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + audit (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout (with LFS for shipped DB)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # wxPython is the only heavy dep, but the test suite is pure
      # Python (no wx imports). Install everything except wxPython on
      # CI to keep job time reasonable; if a test ever imports wx we
      # add it to the install step.
      - name: Install runtime deps (excluding wxPython)
        run: |
          python -m pip install --upgrade pip
          # Strip wxPython from requirements for the CI install.
          grep -v -i '^wxpython' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install pytest

      - name: Verify LFS resolved the shipped DB
        # The seed DB is tracked via Git LFS (~35 MB). If the LFS
        # bandwidth quota is exhausted, actions/checkout@v4 silently
        # leaves the pointer file (~133 bytes) in place and downstream
        # tests error out with "file is not a database". Fail fast with
        # a clear diagnostic instead — the runtime fix is either to
        # unblock LFS quota or to vendor the DB differently.
        run: |
          db_size=$(stat -f%z data/gre_mock.db 2>/dev/null || stat -c%s data/gre_mock.db)
          echo "data/gre_mock.db size: $db_size bytes"
          if [ "$db_size" -lt 1024 ]; then
            echo "::error::data/gre_mock.db is only $db_size bytes — Git LFS content did not resolve. Check bandwidth quota."
            head -c 500 data/gre_mock.db
            exit 1
          fi

      - name: Initialise database
        run: python -c "from models.database import init_db; init_db()"

      - name: Run test suite
        run: |
          set +e
          pytest tests/ -v --tb=long -rA 2>&1 | tee pytest.out
          rc=${PIPESTATUS[0]}
          # Mirror the last 30 KB of output into GITHUB_STEP_SUMMARY so
          # anonymous API callers can read the failure tail — job logs
          # require auth, summaries are part of the public check-run
          # output.
          {
            echo "### pytest exit $rc (python ${{ matrix.python }} on ${{ matrix.os }})"
            echo ""
            echo '```'
            tail -c 30000 pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest.out
          if-no-files-found: ignore
          retention-days: 3

      # The audit's exit code is 0 when no critical-corruption rows
      # are live; we baseline at 0 because PR 1 + PR 2 retired every
      # known offender. Any future regression breaks the build.
      - name: Audit question bank
        run: python scripts/audit_data_corruption.py --summary
